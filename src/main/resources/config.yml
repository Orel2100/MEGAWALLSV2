# MegaWallsFFA Configuration

# Lobby settings
# The location where players are sent after being eliminated.
# This is set in-game using the /megawalls setlobby command.
lobby:
  location:

# Arena settings
# The 'pos1' and 'pos2' values define the cuboid region of the arena.
# These are set in-game using the /arena pos1 and /arena pos2 commands.
arena:
  pos1:
  pos2:
  # A list of spawn locations for players joining the arena.
  # These are managed in-game using /arena addspawn and /arena delspawn.
  spawns: []

# Ore settings
ore:
  # The time in ticks it takes for a mined iron ore to respawn.
  # 20 ticks = 1 second. Default is 600 (30 seconds).
  respawn-delay: 600